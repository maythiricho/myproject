<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>

      .contact-container {
        max-width: 800px;
        margin: 50px auto;
        background-color: rgba(255, 255, 255, 0.95);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      .contact-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #2c3e50;
      }

      .contact-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .contact-form input,
      .contact-form textarea {
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        resize: vertical;
        background-color: #f9f9f9;
      }

      .contact-form button {
        background-color: #63e6be;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .contact-form button:hover {
        background-color: #3ddab2;
      }

      #formSuccess {
        display: none;
        color: green;
        font-weight: bold;
        text-align: center;
        margin-bottom: 20px;
      }

      @media (max-width: 600px) {
        .contact-container {
          margin: 30px 15px;
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="header-content">
        <div class="logo-header">
          <img
            src="photos/main-logo.GIF"
            style="width: 55px; height: 42px"
            alt="Travel Logo"
          />
          <h3>Your Travel Bucket</h3>
        </div>

        <nav class="header-navabar">
          <ul>
            <a href="./index.html">Home</a>
            <li><a href="./destination.html">Destinations</a></li>
            <li><a href="./aboutus.html">About Us</a></li>
            <li><a href="./contactus.html">Contact Us</a></li>
          </ul>
        </nav>
        <div class="hamburger">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
        <div class="topbar">
          <img
            id="avatar-img"
            class="avatar-icon"
            src="photos/default-avatar.png"
            alt="Profile Picture"
            onclick="toggleDropdown()"
            style="
              width: 40px;
              height: 40px;
              border-radius: 50%;
              cursor: pointer;
              object-fit: cover;
            "
          />

          <div class="dropdown" id="dropdownMenu">
            <div class="dropdown-header">
              <strong id="dropdown-username">Username</strong>
              <small id="dropdown-email">Email</small>
            </div>
            <a href="profile.html"
              ><i class="fa-solid fa-user" style="color: #b197fc"></i>Your
              Profile</a
            >
            <a href="yourbucket.html"
              ><i
                class="fa-solid fa-magnifying-glass"
                style="color: #f06292"
              ></i
              >Your Bucket</a
            >

            <button class="logout-btn">Log Out</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Contact Form -->
     <main>
      <div class="contact-container">
        <h2>📬 Get in Touch With Us</h2>
  
        <p id="formSuccess">✅ Your message has been sent!</p>
  
        <form
          class="contact-form"
          action="https://formspree.io/f/xgvkorbz"
          method="POST"
          onsubmit="return handleFormSubmit(event)"
        >
          <input type="text" name="name" placeholder="Your Name" required />
          <input type="email" name="email" placeholder="Your Email" required />
          <input type="text" name="subject" placeholder="Subject" />
          <textarea
            name="message"
            rows="5"
            placeholder="Your Message..."
            required
          ></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>
     </main>


    <!-- Footer -->
    <footer class="cute-footer">
      <div class="footer-content">
        <!-- <img src="photos/logo.gif" alt="Logo" class="footer-logo" /> -->
        <p>Made with ❤️ and too much ☕</p>
        <div class="social-icons">
          <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-twitter"></i></a>
          <a href="#"><i class="fa-brands fa-tiktok"></i></a>
        </div>
        <p class="footer-bottom-text">
          © 2025 Your Travel Bucket. Adventure awaits! 🚀
        </p>
      </div>
    </footer>

    <!-- Script -->
    <script>
      function toggleDropdown() {
        document.getElementById("dropdownMenu").classList.toggle("active");
      }

      window.addEventListener("click", function (e) {
        const dropdown = document.getElementById("dropdownMenu");
        const avatar = document.getElementById("avatar-img");
        if (!dropdown.contains(e.target) && !avatar.contains(e.target)) {
          dropdown.classList.remove("active");
        }
      });

      window.onload = function () {
        const username = localStorage.getItem("currentUser");
        const userData = JSON.parse(localStorage.getItem(username));
        if (userData) {
          document.getElementById("dropdown-username").innerText = username;
          document.getElementById("dropdown-email").innerText = userData.email;
          if (userData.profilePic) {
            document.getElementById("avatar-img").src = userData.profilePic;
          }
        }
      };

      document
        .querySelector(".logout-btn")
        .addEventListener("click", function () {
          localStorage.removeItem("currentUser");
          window.location.href = "login.html";
        });

      function handleFormSubmit(event) {
        event.preventDefault();

        const form = event.target;
        const formData = new FormData(form);

        fetch(form.action, {
          method: "POST",
          body: formData,
          headers: {
            Accept: "application/json",
          },
        }).then((response) => {
          if (response.ok) {
            document.getElementById("formSuccess").style.display = "block";
            form.reset();
          } else {
            alert(
              "❌ There was a problem submitting the form. Please try again."
            );
          }
        });

        return false;
      }

      // --- Hamburger Menu --
      const hamburger = document.querySelector(".hamburger");
      const navMenu = document.querySelector(".header-navabar");

      hamburger.addEventListener("click", () => {
        navMenu.classList.toggle("active");
      });
    </script>
  </body>
</html>
